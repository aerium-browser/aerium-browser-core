name: Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Look at the machine
        run: |
          uname -a
          nproc
          free -g
          ls -la /dev/kvm || echo "no kvm"
          grep -c -E 'svm|vmx' /proc/cpuinfo || true
          cat /proc/cpuinfo | head -20
