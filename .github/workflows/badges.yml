name: badges

on:
  release:
    types: [published]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - name: Draw the badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/badges.py --out "$RUNNER_TEMP/badges"
      - name: Publish to the badges branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch -q origin badges; then
            git switch -q -c badges FETCH_HEAD
          else
            git switch -q --orphan badges
            git rm -rf -q --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP"/badges/*.svg .
          git add ./*.svg
          if git diff --cached --quiet; then
            echo "Badges are up to date."
            exit 0
          fi
          git commit -q -m "badges: update" -m "[skip ci]"
          git push origin badges
