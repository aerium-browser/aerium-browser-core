name: Details

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run whose failure marker to keep'
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: details
  cancel-in-progress: false

jobs:
  keep:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the failure marker
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("build-error-aerium")) | .name' | head -n 1)
          if [ -z "$name" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p marker
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D marker
          if [ ! -s marker/details.enc ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp marker/details.enc "details-$RUN_ID.enc"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=details-$RUN_ID.enc" >> "$GITHUB_OUTPUT"
      - name: Keep it on the draft
        if: steps.fetch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.fetch.outputs.file }}
        run: |
          set -euo pipefail
          tag=stage-details
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --title "$tag" --notes ""
          fi
          gh release upload "$tag" "$FILE" -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[5:] | .[].name' \
            | while read -r old; do
                gh release delete-asset "$tag" "$old" -R "$GITHUB_REPOSITORY" -y
              done
      - name: Tell the Telegram group
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          FOUND: ${{ steps.fetch.outputs.found }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram is not set up, nothing sent"
            exit 0
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          title=$(jq -r '.display_title' <<<"$run")
          url=$(jq -r '.html_url' <<<"$run")
          sha=$(jq -r '.head_sha[0:7]' <<<"$run")
          subject=$(jq -r '(.head_commit.message // "") | split("\n")[0]' <<<"$run")
          text=$(printf '%s failed\n%s %s\n%s' "$title" "$sha" "$subject" "$url")
          api="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          if [ "$FOUND" = true ]; then
            zip -j -q "build-error-$RUN_ID.zip" marker/*
            curl -sS --fail -o /dev/null "$api/sendDocument" \
              --form-string chat_id="$TELEGRAM_CHAT_ID" \
              --form-string caption="$text" \
              -F document=@"build-error-$RUN_ID.zip"
          else
            curl -sS --fail -o /dev/null "$api/sendMessage" \
              --form-string chat_id="$TELEGRAM_CHAT_ID" \
              --form-string text="$text"
          fi
          echo "Sent the failure of run $RUN_ID to Telegram"
