name: Details

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run whose failure marker to keep'
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: details
  cancel-in-progress: false

jobs:
  keep:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the failure marker
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("build-error-aerium")) | .name' | head -n 1)
          if [ -z "$name" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p marker
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D marker
          if [ ! -s marker/details.enc ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp marker/details.enc "details-$RUN_ID.enc"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=details-$RUN_ID.enc" >> "$GITHUB_OUTPUT"
      - name: Keep it on the draft
        if: steps.fetch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.fetch.outputs.file }}
        run: |
          set -euo pipefail
          tag=stage-details
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --title "$tag" --notes ""
          fi
          gh release upload "$tag" "$FILE" -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[5:] | .[].name' \
            | while read -r old; do
                gh release delete-asset "$tag" "$old" -R "$GITHUB_REPOSITORY" -y
              done
