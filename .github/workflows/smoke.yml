name: Smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Full build run to test'
        type: string
        required: false
        default: ''
      apk_url:
        description: 'Or a published APK to test instead'
        type: string
        required: false
        default: ''
      arch:
        description: 'x64 runs natively in the emulator, arm64 only through translation'
        type: choice
        options:
          - x64
          - arm64
        default: x64
      api_level:
        description: 'Android version of the emulator'
        type: string
        required: false
        default: '36'
      flow:
        description: 'What to try after launch'
        type: choice
        options:
          - launch
          - onboarding
          - inspect
        default: launch

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AERIUM_CHECKPOINT_KEY: ${{ secrets.AERIUM_CHECKPOINT_KEY }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the published APK
        if: ${{ inputs.apk_url != '' }}
        env:
          URL: ${{ inputs.apk_url }}
        run: |
          mkdir -p release
          curl -sSfL -o release/aerium-published.apk "$URL"
      - name: Download the APK
        if: ${{ inputs.apk_url == '' }}
        uses: actions/download-artifact@v5
        with:
          name: aerium-full-${{ inputs.arch }}
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: List what the APK carries
        run: |
          apk=$(ls release/aerium-*.apk | grep -v mapping | head -n1)
          ls -la release
          unzip -lv "$apk" | awk 'NR>3 && $NF ~ /^(assets|lib)\// {print $2, $1, $NF}' | sort -k3
          echo "assets: $(unzip -l "$apk" | grep -c ' assets/')"
          mkdir -p dex && unzip -q -o "$apk" 'classes*.dex' -d dex
          echo "dex files: $(ls dex | tr '\n' ' ')"
          echo "suffix known to java: $(cat dex/*.dex | grep -a -c '40064988')"
          echo "plain resources.pak name in java: $(cat dex/*.dex | grep -a -c 'resources\.pak')"
          echo "stored-locales in java: $(cat dex/*.dex | grep -a -c 'stored-locales')"
          unzip -p "$apk" lib/arm64-v8a/libchrome.so > libchrome.so
          echo "native asset paths:"
          strings -n 8 libchrome.so | grep -E '^assets/[a-z_0-9/%.-]+$' | sort -u | head -20
          unzip -p "$apk" resources.arsc > resources.arsc
          for phrase in 'gone Incognito' 'in Aerogel' 'Incognito tabs' 'Aerogel tabs' 'Chrome notifications' 'Aerium notifications' 'Sign in to Chrome' 'Google services' 'Chromium'; do
            n8=$(grep -a -o -F "$phrase" resources.arsc | wc -l)
            n16=$(strings -e l -n 4 resources.arsc | grep -o -F "$phrase" | wc -l)
            echo "phrase '$phrase': $n8 utf8, $n16 utf16"
          done
      - name: Write the test script
        if: ${{ inputs.flow != 'inspect' }}
        run: |
          mkdir -p out
          cat > smoke.sh <<'EOF'
          set -x
          apk=$(ls release/aerium-*.apk | grep -v mapping | head -n1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          pkg=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "$pkg" > out/package.txt
          adb shell getprop ro.product.cpu.abilist > out/abilist.txt
          adb install -r -g "$apk" > out/install.txt 2>&1
          adb root || true
          sleep 3
          adb wait-for-device
          adb shell "echo '_ --disable-breakpad --disable-crashpad-for-testing --disable-features=WebAssemblyTrapHandler,PartitionAllocMemoryTagging --js-flags=--jitless' > /data/local/tmp/chrome-command-line"
          adb shell chmod 644 /data/local/tmp/chrome-command-line
          adb logcat -c
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 > out/launch.txt 2>&1
          sleep 60
          adb shell screencap -p /sdcard/screen1.png && adb pull /sdcard/screen1.png out/screen1.png
          adb shell pidof "$pkg" > out/pid.txt 2>&1
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' > out/activity.txt 2>&1
          adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 && adb pull /sdcard/ui.xml out/ui.xml
          adb logcat -d -v threadtime > out/logcat.txt
          adb logcat -d -b crash -v threadtime > out/crash.txt
          tap() {
            adb shell uiautomator dump /sdcard/tap.xml > /dev/null 2>&1 && adb pull /sdcard/tap.xml out/tap.xml > /dev/null 2>&1
            b=$(grep -oE "$1[^>]*bounds=\"[^\"]+\"" out/tap.xml | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -n1)
            [ -n "$b" ] || { echo "not found: $1" >> out/flow.txt; return 1; }
            set -- $(echo "$b" | tr -c '0-9' ' ')
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
            sleep 4
          }
          if [ "$FLOW" = onboarding ]; then
            tap 'text="Get started"'
            tap 'text="Continue"'
            tap 'text="Continue"'
            tap 'text="Continue"'
            tap 'text="uBlock Origin"'
            tap 'text="floccus"'
            adb shell uiautomator dump /sdcard/ui_ext.xml > /dev/null 2>&1 && adb pull /sdcard/ui_ext.xml out/ui_ext.xml
            tap 'text="Install [0-9]+"'
            for i in $(seq 1 18); do
              sleep 10
              adb shell "cat /data/data/$pkg/shared_prefs/${pkg}_preferences.xml" 2>/dev/null | grep -oE 'aerium_extension_install_progress">[^<]*' >> out/progress.txt
            done
            adb shell uiautomator dump /sdcard/ui_ready.xml > /dev/null 2>&1 && adb pull /sdcard/ui_ready.xml out/ui_ready.xml
            adb shell screencap -p /sdcard/ready.png && adb pull /sdcard/ready.png out/ready.png
            adb shell "ls /data/data/$pkg/app_chrome/Default/Extensions" > out/extdirs.txt 2>&1
            adb logcat -d -v threadtime > out/logcat_flow.txt
          fi
          tap 'text="Skip"' || true
          sleep 6
          adb shell uiautomator dump /sdcard/ui2.xml > /dev/null 2>&1 && adb pull /sdcard/ui2.xml out/ui2.xml
          adb shell am start -a android.intent.action.VIEW -d https://example.com -p "$pkg" >> out/launch.txt 2>&1
          sleep 30
          adb shell screencap -p /sdcard/screen2.png && adb pull /sdcard/screen2.png out/screen2.png
          adb shell uiautomator dump /sdcard/ui3.xml > /dev/null 2>&1 && adb pull /sdcard/ui3.xml out/ui3.xml
          adb shell pidof "$pkg" > out/pid2.txt 2>&1
          adb logcat -d -b crash -v threadtime > out/crash2.txt
          exit 0
          EOF
      - name: Check the extension sources from the runner
        if: ${{ inputs.flow == 'onboarding' }}
        run: |
          curl -sS -o /dev/null -w 'web store: %{http_code} %{redirect_url}\n' -A Aerium 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=156.0.8078.48&acceptformat=crx3&x=id%3Dfnaicdffflnofjppbagibeoednhnbjhg%26uc' | cut -c1-160 || true
          curl -sS -o /dev/null -w 'github: %{http_code}\n' -A Aerium -H 'Accept: application/vnd.github+json' https://api.github.com/repos/gorhill/uBlock/releases/latest || true
      - name: Run the APK in an emulator
        if: ${{ inputs.flow != 'inspect' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW: ${{ inputs.flow }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash smoke.sh
      - name: Translate the stack traces
        if: ${{ inputs.flow != 'inspect' }}
        run: |
          set +e
          mapping=$(ls release/*.apk.mapping | head -n1)
          curl -sSfL -o r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
          for f in crash crash2; do
            java -cp r8.jar com.android.tools.r8.retrace.Retrace "$mapping" "out/$f.txt" > "out/$f.retraced.txt" 2> "out/$f.retrace.log"
          done
          grep -E 'AndroidRuntime|FATAL|DEBUG|libc|chromium|cr_' out/logcat.txt > out/logcat.short.txt
          java -cp r8.jar com.android.tools.r8.retrace.Retrace "$mapping" out/logcat.short.txt > out/logcat.short.retraced.txt 2>/dev/null
          echo "installed: $(grep -q '^Success' out/install.txt && echo yes || echo no)"
          echo "running after 60s: $([ -s out/pid.txt ] && grep -q '^[0-9]' out/pid.txt && echo yes || echo no)"
          echo "java crash: $(grep -q 'FATAL EXCEPTION' out/crash.txt out/crash2.txt && echo yes || echo no)"
          echo "native crash: $(grep -q '\*\*\* \*\*\* \*\*\*' out/crash.txt out/crash2.txt && echo yes || echo no)"
          exit 0
      - name: Show the crash without private names
        if: ${{ inputs.flow != 'inspect' }}
        run: |
          set +e
          echo "--- screen in front ---"
          sed -E 's/^ +//' out/activity.txt 2>/dev/null | head -n 3
          echo "--- text on screen ---"
          grep -oE 'text="[^"]+"' out/ui.xml 2>/dev/null | sed 's/^text=//' | head -n 40
          if [ -s out/flow.txt ] || [ -s out/progress.txt ]; then
            echo "--- onboarding taps ---"
            cat out/flow.txt 2>/dev/null
            echo "--- extensions offered ---"
            grep -oE 'text="[^"]+"' out/ui_ext.xml 2>/dev/null | sed 's/^text=//' | head -n 40
            echo "--- install progress (done,failed,total,finished) ---"
            sed 's/.*">//' out/progress.txt 2>/dev/null | uniq
            echo "--- ready screen ---"
            grep -oE 'text="[^"]+"' out/ui_ready.xml 2>/dev/null | sed 's/^text=//' | head -n 30
            echo "--- extension folders ---"
            cat out/extdirs.txt 2>/dev/null
            echo "--- extension log lines ---"
            grep -iE 'crx|extension|unpack|install' out/logcat_flow.txt 2>/dev/null | grep -iE 'chromium|cr_' \
              | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //; s/com\.aeriumbrowser\.android\.ui\.[A-Za-z0-9_.$]+/[aerium ui]/g' | head -n 60
          fi
          echo "--- text after skip ---"
          grep -oE 'text="[^"]+"' out/ui2.xml 2>/dev/null | sed 's/^text=//' | head -n 30
          echo "--- text with a web page open ---"
          grep -oE 'text="[^"]+"' out/ui3.xml 2>/dev/null | sed 's/^text=//' | head -n 40
          echo "running at the end: $([ -s out/pid2.txt ] && grep -q '^[0-9]' out/pid2.txt && echo yes || echo no)"
          echo "--- processes with a native crash ---"
          grep -ohE '>>> [^ ]+ <<<' out/crash.txt out/crash2.txt 2>/dev/null | sed -E 's/:[0-9]+ <<</ <<</' | sort | uniq -c
          echo "--- native crash signal ---"
          grep -hE 'signal [0-9]+ \(|Abort message|Cause:' out/crash2.txt 2>/dev/null | sed -E 's/^.*(signal [0-9]|Abort message|Cause:)/\1/' | sed -E 's/com\.aeriumbrowser\.android\.ui\.[A-Za-z0-9_.$]+/[aerium ui]/g' | sort | uniq -c | head -n 10
          echo "--- native crash frames ---"
          awk '/\*\*\* \*\*\* \*\*\*/{n++} n==1' out/crash2.txt 2>/dev/null | grep -E '#[0-9]+ pc ' \
            | sed -E 's/^.*(#[0-9]+) pc [0-9a-f]+ +/\1 /; s/ \(BuildId.*//; s#/data/app/[^ ]*/base\.apk#base.apk#' | head -n 16
          for f in out/crash.retraced.txt out/crash2.retraced.txt out/crash.txt; do
            [ -s "$f" ] || continue
            awk '/FATAL EXCEPTION/{on=1} on{print} /^\s*$/{if(on)exit}' "$f" \
              | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ [A-Z] [A-Za-z]+ *: //' \
              | sed -E 's/com\.aeriumbrowser\.android\.ui\.[A-Za-z0-9_.$]+/[aerium ui]/g' \
              | head -n 60
            break
          done
      - name: Seal the results
        if: always()
        run: |
          mkdir -p sealed out
          tar -c -C out . | zstd -q -T0 -19 \
            | openssl enc -aes-256-ctr -pbkdf2 -salt -pass env:AERIUM_CHECKPOINT_KEY -out sealed/smoke.enc
          ls -la sealed
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: sealed/
          retention-days: 10
