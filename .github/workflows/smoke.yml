name: Smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Full build run to test'
        type: string
        required: false
        default: ''
      apk_url:
        description: 'Or a published APK to test instead'
        type: string
        required: false
        default: ''
      arch:
        description: 'x64 runs natively in the emulator, arm64 only through translation'
        type: choice
        options:
          - x64
          - arm64
        default: x64
      api_level:
        description: 'Android version of the emulator'
        type: string
        required: false
        default: '34'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AERIUM_CHECKPOINT_KEY: ${{ secrets.AERIUM_CHECKPOINT_KEY }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the published APK
        if: ${{ inputs.apk_url != '' }}
        env:
          URL: ${{ inputs.apk_url }}
        run: |
          mkdir -p release
          curl -sSfL -o release/aerium-published.apk "$URL"
      - name: Download the APK
        if: ${{ inputs.apk_url == '' }}
        uses: actions/download-artifact@v5
        with:
          name: aerium-full-${{ inputs.arch }}
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: List what the APK carries
        run: |
          apk=$(ls release/aerium-*.apk | grep -v mapping | head -n1)
          ls -la release
          unzip -lv "$apk" | awk 'NR>3 && $NF ~ /^(assets|lib)\// {print $2, $1, $NF}' | sort -k3
          echo "assets: $(unzip -l "$apk" | grep -c ' assets/')"
          mkdir -p dex && unzip -q -o "$apk" 'classes*.dex' -d dex
          echo "dex files: $(ls dex | tr '\n' ' ')"
          echo "suffix known to java: $(cat dex/*.dex | grep -a -c '40064988')"
          echo "plain resources.pak name in java: $(cat dex/*.dex | grep -a -c 'resources\.pak')"
          echo "stored-locales in java: $(cat dex/*.dex | grep -a -c 'stored-locales')"
          unzip -p "$apk" lib/arm64-v8a/libchrome.so > libchrome.so
          echo "native asset paths:"
          strings -n 8 libchrome.so | grep -E '^assets/[a-z_0-9/%.-]+$' | sort -u | head -20
      - name: Write the test script
        run: |
          mkdir -p out
          cat > smoke.sh <<'EOF'
          set -x
          apk=$(ls release/aerium-*.apk | grep -v mapping | head -n1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          pkg=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "$pkg" > out/package.txt
          adb shell getprop ro.product.cpu.abilist > out/abilist.txt
          adb install -r -g "$apk" > out/install.txt 2>&1
          adb root || true
          sleep 3
          adb wait-for-device
          adb shell "echo '_ --disable-breakpad --disable-crashpad-for-testing --disable-features=WebAssemblyTrapHandler,PartitionAllocMemoryTagging --js-flags=--no-wasm-trap-handler' > /data/local/tmp/chrome-command-line"
          adb shell chmod 644 /data/local/tmp/chrome-command-line
          adb logcat -c
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 > out/launch.txt 2>&1
          sleep 60
          adb shell screencap -p /sdcard/screen1.png && adb pull /sdcard/screen1.png out/screen1.png
          adb shell pidof "$pkg" > out/pid.txt 2>&1
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' > out/activity.txt 2>&1
          adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 && adb pull /sdcard/ui.xml out/ui.xml
          adb logcat -d -v threadtime > out/logcat.txt
          adb logcat -d -b crash -v threadtime > out/crash.txt
          adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 >> out/launch.txt 2>&1
          sleep 30
          adb shell screencap -p /sdcard/screen2.png && adb pull /sdcard/screen2.png out/screen2.png
          adb logcat -d -b crash -v threadtime > out/crash2.txt
          exit 0
          EOF
      - name: Run the APK in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash smoke.sh
      - name: Translate the stack traces
        run: |
          set +e
          mapping=$(ls release/*.apk.mapping | head -n1)
          curl -sSfL -o r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
          for f in crash crash2; do
            java -cp r8.jar com.android.tools.r8.retrace.Retrace "$mapping" "out/$f.txt" > "out/$f.retraced.txt" 2> "out/$f.retrace.log"
          done
          grep -E 'AndroidRuntime|FATAL|DEBUG|libc|chromium|cr_' out/logcat.txt > out/logcat.short.txt
          java -cp r8.jar com.android.tools.r8.retrace.Retrace "$mapping" out/logcat.short.txt > out/logcat.short.retraced.txt 2>/dev/null
          echo "installed: $(grep -q '^Success' out/install.txt && echo yes || echo no)"
          echo "running after 60s: $([ -s out/pid.txt ] && grep -q '^[0-9]' out/pid.txt && echo yes || echo no)"
          echo "java crash: $(grep -q 'FATAL EXCEPTION' out/crash.txt out/crash2.txt && echo yes || echo no)"
          echo "native crash: $(grep -q '\*\*\* \*\*\* \*\*\*' out/crash.txt out/crash2.txt && echo yes || echo no)"
          exit 0
      - name: Show the crash without private names
        run: |
          set +e
          echo "--- screen in front ---"
          sed -E 's/^ +//' out/activity.txt 2>/dev/null | head -n 3
          echo "--- text on screen ---"
          grep -oE 'text="[^"]+"' out/ui.xml 2>/dev/null | sed 's/^text=//' | head -n 40
          echo "--- processes with a native crash ---"
          grep -ohE '>>> [^ ]+ <<<' out/crash.txt out/crash2.txt 2>/dev/null | sort | uniq -c
          for f in out/crash.retraced.txt out/crash2.retraced.txt out/crash.txt; do
            [ -s "$f" ] || continue
            awk '/FATAL EXCEPTION/{on=1} on{print} /^\s*$/{if(on)exit}' "$f" \
              | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ [A-Z] [A-Za-z]+ *: //' \
              | sed -E 's/io\.dioide\.aerium\.ui\.[A-Za-z0-9_.$]+/[aerium ui]/g' \
              | head -n 60
            break
          done
      - name: Seal the results
        if: always()
        run: |
          mkdir -p sealed
          tar -c -C out . | zstd -q -T0 -19 \
            | openssl enc -aes-256-ctr -pbkdf2 -salt -pass env:AERIUM_CHECKPOINT_KEY -out sealed/smoke.enc
          ls -la sealed
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: sealed/
          retention-days: 10
